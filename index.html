/* Stigz’s TCG Arena — a felt-table look. Layout: board (opponents / prompt / you) + side rail (preview, stack, log). */
:root {
  --s: 1;   /* size scale, set from the window and the player's choice by ui/uisize.js; tools/build.mjs multiplies pixel sizes by it */
  --felt: #10261c;
  --felt-2: #173426;
  --felt-deep: #08130e;
  --panel: rgba(11, 23, 18, 0.84);
  --panel-solid: #0e1d17;
  --panel-raise: #15291f;
  /* surfaces, lowest to highest: the table, panels and mats, things that float over them */
  --surface-1: linear-gradient(180deg, rgba(24, 46, 36, 0.74), rgba(10, 22, 17, 0.84));
  --surface-2: linear-gradient(180deg, #1a3226, #11241b);
  --surface-3: linear-gradient(180deg, #213d30, #162c22);
  --line: rgba(232, 200, 132, 0.15);
  --line-strong: rgba(232, 200, 132, 0.34);
  --hi: inset 0 1px 0 rgba(255, 255, 255, 0.055);       /* the lit top edge of a raised surface */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.45), 0 calc(4px * var(--s)) calc(14px * var(--s)) rgba(0, 0, 0, 0.28);
  --shadow-2: 0 calc(10px * var(--s)) calc(30px * var(--s)) rgba(0, 0, 0, 0.5);
  --shadow-3: 0 calc(24px * var(--s)) calc(70px * var(--s)) rgba(0, 0, 0, 0.62);

  background: rgba(3, 10, 7, 0.6); border: 1px solid var(--line-strong); color: var(--ink); border-radius: calc(9px * var(--s)); padding: calc(8px * var(--s)) calc(11px * var(--s)); min-width: 0; font: inherit;
  box-shadow: inset 0 1px calc(3px * var(--s)) rgba(0, 0, 0, 0.45); transition: border-color 0.15s, box-shadow 0.15s;
}

/* ---------------- game layout: one screen on desktop (opponents / table center / your mat / hand), natural scroll on small screens */
#root { height: 100%; }

.game { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) calc(300px * var(--s)); min-height: 0; overflow: clip; }

.board::before, .pk-board::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 55% 42% at 50% 50%, rgba(243, 214, 143, 0.055), transparent 72%); }

}

    linear-gradient(180deg, rgba(7, 19, 14, 0.74), rgba(3, 10, 7, 0.8));

/* Off: nothing moves; Reduced: fades stay, flights and shakes go (motion.js) */

.pk-mon.big .pk-dmg { min-width: calc(34px * var(--s)); height: calc(34px * var(--s)); border-radius: calc(17px * var(--s)); font-size: calc(15px * var(--s)); }
.pk-float { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font: 900 calc(26px * var(--s))/1 var(--font-ui); color: #ffdcd3; text-shadow: 0 2px 0 #7a160b, 0 0 calc(12px * var(--s)) rgba(255, 60, 30, 0.8); pointer-events: none; animation: pkfloat 1.1s ease-out forwards; z-index: 3; }

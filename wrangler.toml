# Cloudflare (Workers): the site in docs/ as static files, plus worker/index.js for /relay/* (friends' rooms that
# work on networks blocking browser-to-browser connections). The site is built and committed with `npm run site`,
# so nothing needs to be built on Cloudflare. The name must match the Worker's name there.
name = "stigz-s-mtga"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./docs"
binding = "ASSETS"

# one Durable Object per room (SQLite-backed classes are what the free plan offers; the room keeps nothing on disk)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
